<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <filter id="auroraGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <linearGradient id="auroraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="auroraGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7dd3fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Dark base disc with subtle cyan border -->
  <circle cx="60" cy="60" r="58" fill="#040914" stroke="rgba(56,189,248,0.25)" stroke-width="1.5" />

  <!-- Aurora Borealis Wave Ribbon 1 (cyan/emerald) -->
  <path d="M 22 78 C 36 54, 52 82, 68 56 C 80 38, 96 58, 102 44" fill="none" stroke="url(#auroraGrad)" stroke-width="3" stroke-linecap="round" opacity="0.85" filter="url(#auroraGlow)" />

  <!-- Aurora Wave Ribbon 2 (fainter purple wave) -->
  <path d="M 18 64 C 34 44, 58 72, 74 46 C 86 30, 98 48, 106 38" fill="none" stroke="#c084fc" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.5" />

  <!-- Stylized Geometric "A" Peak (Aurora / Alpha Apex) -->
  <polygon points="60,20 86,88 74,88 60,52 46,88 34,88" fill="url(#auroraGrad)" filter="url(#auroraGlow)" />

  <!-- Crossbar beam with pulse glow -->
  <polygon points="48,68 72,68 70,74 50,74" fill="#38bdf8" opacity="0.9" />

  <!-- Glowing Apex Star at top point -->
  <circle cx="60" cy="20" r="3.5" fill="#ffffff" filter="url(#auroraGlow)" />
  <circle cx="60" cy="20" r="1.5" fill="#38bdf8" />
</svg>
name: Automated Market Bias Daily & Weekly Update

on:
  schedule:
    # Lần 1: 06:17 Sáng giờ VN (GMT+7) = 23:17 UTC (Chủ Nhật - Thứ 5)
    - cron: '17 23 * * 0-4'
    # Lần 2: 07:08 Sáng giờ VN (GMT+7) = 00:08 UTC (Thứ 2 - Thứ 6)
    - cron: '8 0 * * 1-5'
    # Lần 3 (Dự phòng): 07:35 Sáng giờ VN (GMT+7) = 00:35 UTC (Thứ 2 - Thứ 6)
    - cron: '35 0 * * 1-5'
  workflow_dispatch: # Cho phép bấm chạy thủ công trên điện thoại hoặc máy tính
  repository_dispatch: # Cho phép webhook bên ngoài (cron-job.org) kích hoạt chuẩn từng giây
    types: [daily_bias_trigger, webhook]

permissions:
  contents: write

jobs:
  update-bias:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Install Required Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r engine/requirements.txt

      - name: ⚙️ Run Autonomous Ingestion & Bias Calculation
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python engine/run_cloud_update.py

      - name: 🚀 Commit & Deploy to GitHub / Cloudflare Pages
        run: |
          git config --local user.name "KenvinZone Quant Bot"
          git config --local user.email "bot@kenvinzone.com"
          git add data/latest.json engine/data/market_bias.db.gz
          if git diff --staged --quiet; then
            echo "ℹ️ No changes detected in bias calculations."
          else
            git commit -m "auto: daily market bias update $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
            git push
            echo "✅ Successfully pushed fresh Market Bias to production!"
          fi
